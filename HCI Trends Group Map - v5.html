<style>
/* Layout: focus question on top, the top concept, then five branch columns that open downward (Novak-style hierarchy) */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --ink: #16202a;
  --muted: #5a6773;
  --muted2: #7d8994;
  --line: #c4ced6;
  --soft: #e7ecef;
  --root: #1d3557;
  --root-ink: #ffffff;
  --A: #0d7a70; --B: #4a57b0; --C: #a86400; --D: #b0365a; --E: #3d7a36;
  --A-t: #e2f2f0; --B-t: #e8eaf7; --C-t: #f6ecdc; --D-t: #f6e3e9; --E-t: #e5f0e3;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-phrase: "Newsreader", Georgia, "Times New Roman", serif;
  --shadow: 0 1px 2px rgba(22,32,42,.06), 0 2px 8px rgba(22,32,42,.05);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.page { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 28px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--root); outline-offset: 2px; }

/* Header */
header { display: grid; gap: 10px; max-width: 760px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.focus { font-family: var(--font-phrase); font-style: italic; font-size: 19px; line-height: 1.4; margin: 0; color: var(--ink); }
.focus b { font-family: var(--font-ui); font-style: normal; font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.source { color: var(--muted); font-size: 13.5px; margin: 0; }
.source a { color: var(--ink); text-underline-offset: 3px; }

/* Toolbar + legend */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 10px; }
.views { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-solid { width: 22px; height: 0; border-top: 1.5px solid var(--muted); }
.lg-dash { width: 22px; height: 0; border-top: 1.5px dashed var(--muted); }
.lg-phrase { font-family: var(--font-phrase); font-style: italic; font-size: 14px; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }

/* Map */
.mapscroll { overflow-x: auto; }
.map { position: relative; min-width: 1060px; padding-bottom: 8px; }
.map svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.wires path.x { stroke-dasharray: 5 4; stroke-width: 1.4; }
.rootrow { display: flex; justify-content: center; padding-bottom: 54px; }
.cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; align-items: start; }
.col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.headphrase { text-align: center; }

.node { display: inline-flex; align-items: baseline; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; box-shadow: var(--shadow); font-size: 14px; line-height: 1.3; font-weight: 500; transition: opacity .15s, border-color .15s, background .15s; max-width: 100%; }
.node .n { min-width: 0; }
.node .c { font-size: 11.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.node:hover { border-color: var(--muted); }
.node.root { background: var(--root); color: var(--root-ink); border-color: var(--root); font-size: 18px; font-weight: 600; padding: 12px 20px; border-radius: 10px; }
.node.root .c { color: var(--root-ink); opacity: .75; }
.node.head { width: 100%; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; padding: 10px 12px; border-width: 1.5px; }
.col[data-b="A"] .node.head { border-color: var(--A); background: var(--A-t); }
.col[data-b="B"] .node.head { border-color: var(--B); background: var(--B-t); }
.col[data-b="C"] .node.head { border-color: var(--C); background: var(--C-t); }
.col[data-b="D"] .node.head { border-color: var(--D); background: var(--D-t); }
.col[data-b="E"] .node.head { border-color: var(--E); background: var(--E-t); }
.theme { font-size: 12.5px; color: var(--muted); padding-inline: 2px; }
.toggle { justify-self: start; border: 0; background: none; padding: 2px; font-size: 13px; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.toggle .badge { margin-left: 6px; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; display: inline-block; }

.phrase { font-family: var(--font-phrase); font-style: italic; font-size: 14.5px; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 3px; text-decoration-thickness: 1px; line-height: 1.2; }
.xlabel { position: absolute; transform: translate(-50%, -50%); background: var(--bg); padding: 0 4px; font-size: 13.5px; pointer-events: none; white-space: nowrap; }

/* Branch trees */
ul.tree { list-style: none; margin: 0; padding: 0 0 0 10px; display: grid; gap: 6px; }
ul.tree ul.tree { padding-left: 16px; margin-top: 6px; }
ul.tree li { position: relative; padding-left: 14px; display: grid; gap: 3px; justify-items: start; min-width: 0; }
ul.tree li::before { content: ""; position: absolute; left: 0; top: -6px; bottom: 0; border-left: 1.5px solid var(--bc); }
ul.tree li:last-child::before { bottom: auto; height: 34px; }
ul.tree li::after { content: ""; position: absolute; left: 0; top: 28px; width: 10px; border-top: 1.5px solid var(--bc); }
.col[data-b="A"] { --bc: var(--A); } .col[data-b="B"] { --bc: var(--B); } .col[data-b="C"] { --bc: var(--C); } .col[data-b="D"] { --bc: var(--D); } .col[data-b="E"] { --bc: var(--E); }
ul.tree li > .phrase { font-size: 13.5px; padding-top: 2px; }

/* Selection */
.map.selecting .node { opacity: .28; }
.map.selecting .node.sel, .map.selecting .node.rel { opacity: 1; }
.node.sel { outline: 2px solid var(--ink); outline-offset: 2px; }
.node.rel { border-color: var(--ink); }

/* Cross-links list */
.xlinks h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
.xlinks ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 24px; }
.xlinks button { width: 100%; text-align: left; border: 0; border-bottom: 1px dashed var(--line); background: none; padding: 6px 0; cursor: pointer; font-size: 14px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
.xlinks button:hover .cn { text-decoration: underline; text-underline-offset: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; transform: translateY(-1px); }

/* Notes below map */
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; border-top: 1px solid var(--line); padding-top: 22px; }
.notes section { min-width: 0; }
.notes h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
.notes ol, .notes ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; max-width: 62ch; }
.notes p { margin: 0 0 8px; max-width: 62ch; }

/* Drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); padding: calc(env(safe-area-inset-top, 0px) + 20px) 22px calc(env(safe-area-inset-bottom, 0px) + 24px); overflow-y: auto; display: grid; gap: 16px; align-content: start; z-index: 10; }
.drawer .close { justify-self: end; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.drawer h3 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
.drawer .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--soft); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); }
.drawer h4 { margin: 0 0 6px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sentences { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.sentences li { font-size: 14px; }
.grp { display: grid; gap: 6px; }
.grp + .grp { margin-top: 10px; }
.grp .lab { font-size: 12.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chip.drawn { border-color: var(--ink); }
.kw { font-size: 13px; color: var(--muted); }
.fine { font-size: 12.5px; color: var(--muted); }

@media (max-width: 760px) {
  .map { min-width: 0; }
  .map svg.wires, .xlabel { display: none; }
  .rootrow { padding-bottom: 18px; justify-content: flex-start; }
  .cols { grid-template-columns: 1fr; gap: 22px; }
  .headphrase { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .node { transition: none; } }
</style>

    }
    d += `<path class="cl" d="M${x1},${y1} ${c} ${x2},${y2}" marker-end="url(#ah)"/>`;
    // label: first spot along the line that does not cover a concept, phrase or another label
    const pts = c.slice(1).split(" ").map(q => q.split(",").map(Number));
    const P = [[x1, y1], pts[0], pts[1], [x2, y2]];
    const at = t => [0, 1].map(i => (1-t)**3*P[0][i] + 3*(1-t)**2*t*P[1][i] + 3*(1-t)*t*t*P[2][i] + t**3*P[3][i]);
    const w = ph.length * 6.4 + 10, h = 18;
    let best = null;
    const cands = [];
    [0.5, 0.4, 0.6, 0.3, 0.7, 0.2, 0.8].forEach((t, ti) => [0, -40, 40, -80, 80].forEach(dx => [0, -14, 14, -28, 28, -42, 42, 56].forEach(dy => cands.push([t, dx, dy, ti * 4 + Math.abs(dx) / 10 + Math.abs(dy) / 7]))));
    cands.sort((p, q) => p[3] - q[3]);
    for (const [t, dx, dy] of cands) {
      const [x0, y0] = at(t), x = x0 + dx, y = y0 + dy, r = { x: x - w / 2, y: y - h / 2, w, h };
      if (!obstacles.some(o => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y)) { best = [x, y, r]; break; }
    }
    if (!best) { const [x, y] = at(0.5); best = [x, y, { x: x - w / 2, y: y - h / 2, w, h }]; }
    obstacles.push(best[2]);
    labels += `<text x="${best[0]}" y="${best[1] + 4}" text-anchor="middle">${esc(ph)}</text>`;
  });
  wires.innerHTML = d;
  wlabels.innerHTML = labels;
}


// ---- Sun layout: the topic in the centre, the five areas on a ring around it, each area's concepts on its outer side ----
// Every position below was placed by hand: concepts sit outward from their own area, links within an area stay short,
// links between neighbouring areas follow the ring, and the long links between distant areas run around the outside.
let layout = "sun";
const sun = document.getElementById("sun");
const SUN = {
  kx: 1.1, ky: 280 / 300,                          // the ring is a slightly wide ellipse
  pos: {
    11: [0, -280], 1: [314, -87], 3: [194, 227], 10: [-194, 227], 16: [-314, -87],
    15: [-200, -365], 8: [-80, -435], 23: [80, -435], 30: [205, -365],
    27: [-370, -245], 6: [-560, -190], 19: [-600, -20], 7: [-730, -130], 2: [-490, 110],
    4: [-340, 340], 29: [-490, 400], 18: [-110, 370], 28: [-150, 470], 20: [-390, 505],
    12: [450, -235], 5: [380, -360], 24: [545, -380], 22: [665, -300], 14: [600, -110], 9: [720, 20], 25: [455, 45],
    21: [520, 180], 17: [330, 385], 26: [700, 300], 13: [120, 395]
  },
  // links between neighbouring areas bulge outward along the ring; the main view gets a rounder ring
  ringMain: { "1-11": 30, "1-3": 30, "3-10": 30, "10-16": 30 },
  ringOpen: { "1-11": 30, "1-3": 15, "3-10": 10, "10-16": 30 },
  // how other links bend: a number bows the line away from the centre, a list gives points the line passes through
  bend: {
    "1-10": 0.06, "3-16": 0.08,
    "17-2": [[300, 480], [60, 565], [-320, 585], [-600, 510], [-650, 320]],
    "26-19": [[700, 440], [480, 585], [80, 625], [-340, 630], [-650, 550], [-730, 350], [-700, 120]],
    "4-11": [[-330, 225], [-250, 60], [-130, -140]],
    "18-19": [[-250, 290], [-395, 190], [-405, 70]],
    "1-27": -0.05, "14-27": -0.03, "14-21": 0.05
  }
};
const TOPIC_R = 68;
const measure = document.createElement("canvas").getContext("2d");
// one line when short, otherwise the most even split into two lines
function wrapBox(text, font, oneLine) {
  measure.font = font; const W = s => measure.measureText(s).width, words = text.split(" ");
  if (W(text) <= oneLine || words.length < 2) return [{ t: text, w: W(text) }];
  let best = null;
  for (let i = 1; i < words.length; i++) { const a = words.slice(0, i).join(" "), b = words.slice(i).join(" "), m = Math.max(W(a), W(b)); if (!best || m < best.m) best = { m, L: [a, b] }; }
  return best.L.map(l => ({ t: l, w: W(l) }));
}
// link shapes: each is a function from t in [0, 1] to a point, running from the centre of A to the centre of B
const lerp = (a, b, t) => a + (b - a) * t;
const straight = (A, B) => t => [lerp(A[0], B[0], t), lerp(A[1], B[1], t)];
function bow(A, B, k) {
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1], d = Math.hypot(dx, dy);
  let nx = -dy / d, ny = dx / d; if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
  const M = [mx + nx * d * k, my + ny * d * k];
  return t => [0, 1].map(i => (1 - t) ** 2 * A[i] + 2 * (1 - t) * t * M[i] + t * t * B[i]);
}
function ringArc(A, B, bulge) {
  const qa = [A[0] / SUN.kx, A[1] / SUN.ky], qb = [B[0] / SUN.kx, B[1] / SUN.ky], ra = Math.hypot(...qa), rb = Math.hypot(...qb);
  let ta = Math.atan2(qa[1], qa[0]), tb = Math.atan2(qb[1], qb[0]);
  while (tb - ta > Math.PI) tb -= 2 * Math.PI; while (ta - tb > Math.PI) tb += 2 * Math.PI;
  return t => { const th = lerp(ta, tb, t), r = lerp(ra, rb, t) + bulge * Math.sin(Math.PI * t); return [SUN.kx * r * Math.cos(th), SUN.ky * r * Math.sin(th)]; };
}
function through(A, B, pts) {
  const W = [A, ...pts, B], segs = [], n = W.length;
  const ext = (i, j) => [2 * W[i][0] - W[j][0], 2 * W[i][1] - W[j][1]];
  for (let i = 0; i < n - 1; i++) {
    const p0 = i === 0 ? ext(0, 1) : W[i - 1], p1 = W[i], p2 = W[i + 1], p3 = i + 2 >= n ? ext(n - 1, n - 2) : W[i + 2];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    segs.push(t => [0, 1].map(k => (1 - t) ** 3 * p1[k] + 3 * (1 - t) ** 2 * t * c1[k] + 3 * (1 - t) * t * t * c2[k] + t ** 3 * p2[k]));
  }
  const P = []; segs.forEach(f => { for (let j = 0; j < 60; j++) P.push(f(j / 60)); }); P.push(B);
  const cum = [0]; for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const L = cum[cum.length - 1];
  return t => { const d = t * L; let lo = 0, hi = cum.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < d) lo = m; else hi = m; } const u = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1); return [lerp(P[lo][0], P[hi][0], u), lerp(P[lo][1], P[hi][1], u)]; };
}
const shaped = (A, B, R, dflt) => R == null ? dflt : Array.isArray(R) ? through(A, B, R) : bow(A, B, R);

function drawSun() {
  const shown = id => isHead(id) || open.has(areaOf[id]);
  const ids = SHEET.concepts.map(c => c.id).filter(shown);
  const P = id => SUN.pos[id];
  const BOX = {};
  ids.forEach(id => {
    const h = isHead(id), L = wrapBox(C[id].name, h ? '600 15.5px "Instrument Sans"' : '500 13.5px "Instrument Sans"', h ? 200 : 130);
    const lh = h ? 19 : 17, px = h ? 15 : 11, py = h ? 10 : 8, w = Math.max(...L.map(l => l.w)) + 2 * px, hh = L.length * lh + 2 * py - 2;
    BOX[id] = { x: P(id)[0] - w / 2, y: P(id)[1] - hh / 2, w, h: hh, lines: L, lh, py, head: h };
  });
  const inside = (p, b, m) => p[0] > b.x - m && p[0] < b.x + b.w + m && p[1] > b.y - m && p[1] < b.y + b.h + m;
  // sample a link and cut it where it enters each box
  const cut = (f, a, b, gap) => {
    const N = 240, pts = []; for (let i = 0; i <= N; i++) pts.push(f(i / N));
    let i0 = 0, i1 = N;
    if (a === "topic") while (i0 < N && Math.hypot(...pts[i0]) < TOPIC_R + 3) i0++; else while (i0 < N && inside(pts[i0], BOX[a], 3)) i0++;
    while (i1 > 0 && inside(pts[i1], BOX[b], gap)) i1--;
    return pts.slice(i0, i1 + 1);
  };
  const links = [];
  const ring = open.size ? SUN.ringOpen : SUN.ringMain;
  MAP.tree.forEach(([p, c, ph]) => { if (shown(c)) links.push({ kind: "tree", a: p, b: c, ph, pts: cut(straight(P(p), P(c)), p, c, 3) }); });
  const order = MAP.areas.map(a => a.head), n = order.length;
  MAP.areaLinks.forEach(([a, b, ph]) => {
    const ia = order.indexOf(a), ib = order.indexOf(b), adj = (ia - ib + n) % n === 1 || (ib - ia + n) % n === 1, k = a + "-" + b;
    const f = adj ? ringArc(P(a), P(b), ring[k] || 0) : shaped(P(a), P(b), SUN.bend[k], bow(P(a), P(b), 0));
    links.push({ kind: "area", a, b, ph, pts: cut(f, a, b, 7) });
  });
  MAP.dashed.forEach(([a, b, ph]) => {
    if (!shown(a) || !shown(b)) return;
    links.push({ kind: "cross", a, b, ph, pts: cut(shaped(P(a), P(b), SUN.bend[a + "-" + b], bow(P(a), P(b), 0.12)), a, b, 7) });
  });

  // phrases: try spots along each link and keep the one that covers the fewest boxes, other phrases and other lines
  measure.font = 'italic 400 14px Newsreader';
  const blocks = ids.map(id => ({ x: BOX[id].x - 4, y: BOX[id].y - 4, w: BOX[id].w + 8, h: BOX[id].h + 8 }));
  blocks.push({ x: -TOPIC_R, y: -TOPIC_R, w: 2 * TOPIC_R, h: 2 * TOPIC_R });
  const ov = (r, o) => Math.max(0, Math.min(r.x + r.w, o.x + o.w) - Math.max(r.x, o.x)) * Math.max(0, Math.min(r.y + r.h, o.y + o.h) - Math.max(r.y, o.y));
  const taken = [], rank = { area: 0, tree: 1, cross: 2 };
  links.slice().sort((p, q) => rank[p.kind] - rank[q.kind]).forEach(l => {
    const w = measure.measureText(l.ph).width + 8, h = 17;
    const cum = [0]; for (let i = 1; i < l.pts.length; i++) cum.push(cum[i - 1] + Math.hypot(l.pts[i][0] - l.pts[i - 1][0], l.pts[i][1] - l.pts[i - 1][1]));
    const L = cum[cum.length - 1], at = s => { let i = cum.findIndex(c => c >= s * L); return l.pts[i < 0 ? cum.length - 1 : i]; };
    let best = null, score = Infinity;
    for (const s of [0.5, 0.44, 0.56, 0.38, 0.62, 0.32, 0.68, 0.26, 0.74, 0.2, 0.8]) for (const dy of [0, -9, 9]) {
      const p = at(s), r = { x: p[0] - w / 2, y: p[1] + dy - h / 2, w, h };
      const crossed = links.reduce((t, o) => o === l ? t : t + o.pts.filter(q => q[0] > r.x && q[0] < r.x + r.w && q[1] > r.y && q[1] < r.y + r.h).length, 0);
      const sc = blocks.reduce((t, o) => t + ov(r, o), 0) + taken.reduce((t, o) => t + 3 * ov(r, o), 0) + crossed * 25 + Math.abs(s - 0.5) * 40 + Math.abs(dy) * 2;
      if (sc < score) { score = sc; best = r; }
    }
    l.label = best; taken.push(best);
  });

  const d = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
  let out = `<defs><marker id="sah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker><marker id="sah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted2)"/></marker></defs>`;
  links.forEach(l => {
    const at = `data-a="${l.a}" data-b="${l.b}"`;
    if (l.kind === "tree") out += `<path class="lk stree" ${at} d="${d(l.pts)}" style="stroke:var(--${areaOf[l.b]})"/>`;
    else out += `<path class="lk ${l.kind === "area" ? "sarea" : "scross"}" ${at} d="${d(l.pts)}" marker-end="url(#${l.kind === "area" ? "sah" : "sah2"})"/>`;
  });
  const tl = ["HCI research", "on AI and", "learning"];
  out += `<circle r="${TOPIC_R}" class="stopic"/>` + tl.map((t, i) => `<text class="stopict" text-anchor="middle" y="${(i - 1) * 19 + 5}">${t}</text>`).join("");
  links.forEach(l => out += `<text class="lb sphrase" data-a="${l.a}" data-b="${l.b}" x="${(l.label.x + l.label.w / 2).toFixed(1)}" y="${(l.label.y + 12.5).toFixed(1)}" text-anchor="middle">${esc(l.ph)}</text>`);
  ids.forEach(id => {
    const b = BOX[id], k = areaOf[id], cx = b.x + b.w / 2;
    out += `<g class="snode${b.head ? " shead" : ""}" data-id="${id}"${b.head ? ` data-b="${k}" role="button" tabindex="0" aria-label="${esc(C[id].name)}: show or hide its concepts"` : ""}><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9" style="fill:${b.head ? `var(--${k}-t)` : "var(--surface)"};stroke:var(--${k})"/>` +
      b.lines.map((L, i) => `<text class="sname${b.head ? " b" : ""}" text-anchor="middle" x="${cx}" y="${(b.y + b.py + (i + 0.78) * b.lh).toFixed(1)}">${esc(L.t)}</text>`).join("") + `</g>`;
  });
  sun.innerHTML = out;
  const bb = sun.getBBox(), m = 24;
  sun.setAttribute("viewBox", `${bb.x - m} ${bb.y - m} ${bb.width + 2 * m} ${bb.height + 2 * m}`);
  sun.style.maxWidth = (bb.width + 2 * m) + "px";
}
// pointing at a concept shows its links and the concepts at their other ends
function lightUp(id) {
  sun.classList.toggle("hl", id != null);
  sun.querySelectorAll(".on").forEach(e => e.classList.remove("on"));
  if (id == null) return;
  sun.querySelectorAll(`[data-a="${id}"], [data-b="${id}"]`).forEach(e => {
    if (!e.matches(".lk, .lb")) return;
    e.classList.add("on");
    [e.dataset.a, e.dataset.b].forEach(x => { const g = sun.querySelector(`.snode[data-id="${x}"]`); if (g) g.classList.add("on"); });
  });
  const g = sun.querySelector(`.snode[data-id="${id}"]`); if (g) g.classList.add("on");
}
sun.addEventListener("pointerover", e => { const g = e.target.closest(".snode"); lightUp(g ? g.dataset.id : null); });
sun.addEventListener("pointerleave", () => lightUp(null));
sun.addEventListener("keydown", e => { const g = e.target.closest(".shead"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setOpen(g.dataset.b, !open.has(g.dataset.b)); refresh(); } });
sun.addEventListener("click", e => { const g = e.target.closest(".shead"); if (g) { setOpen(g.dataset.b, !open.has(g.dataset.b)); refresh(); } });
function setLayout(l) {
  layout = l;
  document.getElementById("colBtn").setAttribute("aria-pressed", l === "cols");
  document.getElementById("sunBtn").setAttribute("aria-pressed", l === "sun");
  document.querySelector(".mapscroll").hidden = l !== "cols";
  document.getElementById("sunwrap").hidden = l !== "sun";
  refresh();
}
document.getElementById("colBtn").onclick = () => setLayout("cols");
document.getElementById("sunBtn").onclick = () => setLayout("sun");

function refresh() { syncViewButtons(); syncFloats(); if (layout === "sun") drawSun(); else draw(); }
window.addEventListener("resize", () => layout === "cols" && draw());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
// box sizes are measured with the map's own fonts, so make sure the weights it uses are loaded, then draw again
if (document.fonts && document.fonts.load) Promise.all(['500 13.5px "Instrument Sans"', '600 15.5px "Instrument Sans"', 'italic 400 14px Newsreader'].map(f => document.fonts.load(f))).then(refresh, refresh);
refresh();
</script>
