<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Arendusteoreem</title>
<style>
  :root{
    --bg:#12161d;
    --line:#e9ebef;
    --num:#e9ebef;
    --dim:#3a4252;
    --pivot:#e0a53d;
    --red:#e0503f;
    --minor:#4fb3a6;
    --pivot-glow: rgba(224,165,61,.35);
    --track:#232b38;
    --cell:60px;
  }
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Palatino Linotype','Book Antiqua',Georgia,serif;
  }
  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
    padding:40px 32px;
  }

  .formula{
    font-size:1.25rem;
    font-style:italic;
    color:var(--num);
    text-align:center;
  }
  .formula .plain{ font-style:normal; }
  .formula .sub{ font-size:.72em; }
  .formula .accent{ color:var(--pivot); }

  .stage{
    display:flex;
    align-items:center;
    gap:52px;
  }
  .bars{ display:flex; align-items:center; }
  .bar{ width:2.5px; align-self:stretch; background:var(--line); }
  .grid{ position:relative; display:grid; margin:0 14px; }
  .cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
    font-style:italic;
    color:var(--num);
    transition: color .3s ease, opacity .3s ease;
    z-index:2;
  }
  .cell.pivot{ color:var(--pivot); text-shadow:0 0 10px var(--pivot-glow); }
  .cell.gone{ opacity:.22; }
  .cell.rowlit{ color:#fff; }

  .crossline{
    position:absolute;
    background:var(--red);
    opacity:.9;
    pointer-events:none;
    z-index:1;
    transition: top .3s ease, left .3s ease;
  }
  .crossline.h{ height:3px; left:0; right:0; }
  .crossline.v{ width:3px; top:0; bottom:0; }

  .connector{
    width:36px; height:2px;
    background:linear-gradient(90deg, var(--dim), var(--minor));
    opacity:.7;
  }

  .grid2 .cell{ opacity:0; transform:translateY(8px) scale(.9); }
  .grid2 .cell.show{
    opacity:1; transform:translateY(0) scale(1);
    transition: opacity .4s ease .05s, transform .4s ease .05s;
    color:var(--minor);
  }

  .terms{
    display:flex;
    gap:26px;
  }
  .term{
    font-size:1.1rem;
    font-style:italic;
    color:var(--dim);
    opacity:.25;
    transition: opacity .4s ease, color .4s ease;
    white-space:nowrap;
  }
  .term.active{ color:var(--pivot); opacity:1; }
  .term.done{ color:var(--num); opacity:1; }
  .term .sub{ font-size:.7em; }
  .term .plus{ color:var(--dim); margin:0 4px; }

  .sum{
    font-size:1.3rem;
    font-style:italic;
    color:var(--minor);
    opacity:0;
    transition: opacity .5s ease;
    text-align:center;
  }
  .sum.show{ opacity:1; }
  .sum .plain{ font-style:normal; }

  .ctrl{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ctrl label{
    font-style:italic; font-size:1.15rem; color:var(--num);
    width:16px; text-align:center;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:170px; height:4px; border-radius:2px;
    background:var(--track); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:var(--red); border:2px solid var(--bg);
    box-shadow:0 0 0 2px var(--red); cursor:pointer;
    transition: transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.12); }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%;
    background:var(--red); border:2px solid var(--bg);
    box-shadow:0 0 0 2px var(--red); cursor:pointer;
  }
  input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:var(--track); }
</style>
</head>
<body>

<div class="wrap">
  <div class="formula" id="formulaTop"></div>

  <div class="stage">
    <div class="bars">
      <div class="bar"></div>
      <div class="grid" id="grid3"></div>
      <div class="bar"></div>
    </div>
    <div class="connector"></div>
    <div class="bars">
      <div class="bar"></div>
      <div class="grid grid2" id="grid2"></div>
      <div class="bar"></div>
    </div>
  </div>

  <div class="terms" id="terms"></div>
  <div class="sum" id="sumLine"></div>

  <div class="ctrl">
    <label><i>i</i></label>
    <input type="range" id="sliderI" min="1" max="3" value="1" step="1">
  </div>
</div>

<script>
  const N = 3, CELL = 60;
  const M = [
    [5, -2, 3],
    [0,  4,-1],
    [-6, 1, 7]
  ];

  const grid3 = document.getElementById('grid3');
  grid3.style.gridTemplateColumns = `repeat(${N}, ${CELL}px)`;
  grid3.style.gridTemplateRows = `repeat(${N}, ${CELL}px)`;
  grid3.style.width = (N*CELL)+'px';
  grid3.style.height = (N*CELL)+'px';

  const grid2 = document.getElementById('grid2');
  grid2.style.gridTemplateColumns = `repeat(2, ${CELL}px)`;
  grid2.style.gridTemplateRows = `repeat(2, ${CELL}px)`;
  grid2.style.width = (2*CELL)+'px';
  grid2.style.height = (2*CELL)+'px';

  const cells3 = [];
  for(let r=1;r<=N;r++){
    for(let c=1;c<=N;c++){
      const div = document.createElement('div');
      div.className = 'cell';
      div.textContent = M[r-1][c-1];
      div.dataset.r = r; div.dataset.c = c;
      grid3.appendChild(div);
      cells3.push(div);
    }
  }
  const lineH = document.createElement('div'); lineH.className='crossline h';
  const lineV = document.createElement('div'); lineV.className='crossline v';
  grid3.appendChild(lineH); grid3.appendChild(lineV);

  const cells2 = [];
  for(let k=0;k<4;k++){
    const div = document.createElement('div');
    div.className='cell';
    cells2.push(div);
    grid2.appendChild(div);
  }

  const termsEl = document.getElementById('terms');
  const termEls = [];
  for(let j=1;j<=3;j++){
    const s = document.createElement('span');
    s.className = 'term';
    termsEl.appendChild(s);
    termEls.push(s);
    if(j<3){
      const plus = document.createElement('span');
      plus.className='plus'; plus.textContent='+';
      termsEl.appendChild(plus);
    }
  }
  const sumLine = document.getElementById('sumLine');
  const formulaTop = document.getElementById('formulaTop');
  const sliderI = document.getElementById('sliderI');

  function center(idx){ return (idx-1)*CELL + CELL/2; }

  function cofactorAt(r,c){
    const rest = [];
    for(let rr=1; rr<=N; rr++){
      for(let cc=1; cc<=N; cc++){
        if(rr!==r && cc!==c) rest.push(M[rr-1][cc-1]);
      }
    }
    const minorDet = rest[0]*rest[3] - rest[1]*rest[2];
    const sign = ((r+c)%2===0) ? 1 : -1;
    return { rest, minorDet, cofactor: sign*minorDet, sign };
  }

  let timers = [];
  function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }

  function showColumn(i,j){
    lineH.style.top = (center(i)-1.5)+'px';
    lineV.style.left = (center(j)-1.5)+'px';

    cells3.forEach(cell=>{
      const r=+cell.dataset.r, c=+cell.dataset.c;
      cell.classList.remove('pivot','gone');
      if(r===i && c===j) cell.classList.add('pivot');
      else if(r===i || c===j) cell.classList.add('gone');
    });

    const {rest, cofactor} = cofactorAt(i,j);
    cells2.forEach((cell,idx)=>{ cell.textContent = rest[idx]; });
    cells2.forEach(c=>c.classList.remove('show'));
    requestAnimationFrame(()=> cells2.forEach(c=>c.classList.add('show')) );

    return cofactor;
  }

  function run(i){
    clearTimers();
    formulaTop.innerHTML =
      '<span class="plain">det A =</span> ' +
      'a<span class="sub">'+i+'1</span>A<span class="sub">'+i+'1</span> + ' +
      'a<span class="sub">'+i+'2</span>A<span class="sub">'+i+'2</span> + ' +
      'a<span class="sub">'+i+'3</span>A<span class="sub">'+i+'3</span>';

    termEls.forEach(el=>{ el.className='term'; el.textContent=''; });
    sumLine.classList.remove('show');
    sumLine.textContent = '';

    let total = 0;
    const seq = [1,2,3];

    seq.forEach((j, idx)=>{
      const t = setTimeout(()=>{
        termEls.forEach(el=>el.classList.remove('active'));
        const cof = showColumn(i,j);
        const a = M[i-1][j-1];
        total += a*cof;
        const el = termEls[j-1];
        el.classList.add('active');
        el.innerHTML = a+'&middot;A<span class="sub">'+i+j+'</span><span class="plain">('+cof+')</span>';
        setTimeout(()=>{ el.classList.remove('active'); el.classList.add('done'); }, 650);

        if(idx === seq.length-1){
          setTimeout(()=>{
            sumLine.innerHTML = '<span class="plain">det A =</span> ' + total;
            sumLine.classList.add('show');
          }, 750);
        }
      }, idx*1500);
      timers.push(t);
    });
  }

  sliderI.addEventListener('input', ()=> run(+sliderI.value) );
  run(1);
</script>

</body>
</html>
